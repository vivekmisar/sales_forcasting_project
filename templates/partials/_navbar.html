<nav class="bg-gray-900/50 backdrop-blur-sm p-4 fixed top-0 left-0 right-0 z-10">
    <div class="container mx-auto flex justify-between items-center">
        <a href="{% url 'home' %}" class="text-2xl font-bold text-white">ForecastFlow</a>
        <div class="flex items-center space-x-4">
            <a href="{% url 'home' %}" class="text-gray-300 hover:text-white transition">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white transition">Dashboard</a>
                <div class="flex items-center space-x-4">
                     <a href="{% url 'profile' %}" class="font-medium text-white">Welcome, {{ user.username }}</a>
                     <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition">Logout</button>
                     </form>
                </div>
            {% else %}
                 <a href="{% url 'login' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition">Login</a>
            {% endif %}
        </div>
    </div>
</nav>
