{% extends 'base.html' %}

{% block title %}Login | ForecastFlow{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-2xl shadow-lg">
        <h2 class="text-3xl font-bold text-center text-white">Login to ForecastFlow</h2>

        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="p-4 rounded-md text-sm
                        {% if message.tags == 'error' %} bg-red-900 bg-opacity-50 text-red-200 border border-red-700
                        {% elif message.tags == 'success' %} bg-green-900 bg-opacity-50 text-green-200 border border-green-700
                        {% else %} bg-blue-900 bg-opacity-50 text-blue-200 border border-blue-700
                        {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% url 'login' %}" method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="username" class="text-sm font-medium text-gray-300">Username</label>
                <input type="text" name="username" id="username" class="w-full px-4 py-2 mt-2 text-white bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div>
                <label for="password" class="text-sm font-medium text-gray-300">Password</label>
                <input type="password" name="password" id="password" class="w-full px-4 py-2 mt-2 text-white bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div>
                <button type="submit" class="w-full px-4 py-2 font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition duration-300">
                    Login
                </button>
            </div>
        </form>
        <p class="text-sm text-center text-gray-400">
            Don't have an account? <a href="{% url 'register' %}" class="font-medium text-indigo-400 hover:underline">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
