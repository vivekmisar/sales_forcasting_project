{% extends 'base.html' %}

{% block title %}Login | ForecastFlow{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md p-8 glass rounded-2xl shadow-2xl border border-white/10 relative overflow-hidden">

        <!-- Decorative Glow -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-500/30 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/30 rounded-full blur-2xl"></div>

        <div class="relative z-10">
            <h2
                class="text-3xl font-bold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-white to-brand-200">
                Welcome Back</h2>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div class="space-y-2">
                    <label for="username" class="text-sm font-medium text-gray-300 ml-1">Username</label>
                    <input type="text" name="username" id="username" required
                        class="w-full px-4 py-3 bg-dark-bg/50 border border-dark-border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all text-white placeholder-gray-500"
                        placeholder="Enter your username">
                </div>

                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium text-gray-300 ml-1">Password</label>
                    <input type="password" name="password" id="password" required
                        class="w-full px-4 py-3 bg-dark-bg/50 border border-dark-border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all text-white placeholder-gray-500"
                        placeholder="••••••••">
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg shadow-brand-500/20 transition-all duration-300 transform hover:scale-[1.02]">
                    Sign In
                </button>
            </form>

            <p class="mt-8 text-center text-gray-400 text-sm">
                Don't have an account?
                <a href="{% url 'register' %}"
                    class="text-brand-400 hover:text-brand-300 font-semibold transition-colors">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
