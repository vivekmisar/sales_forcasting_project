{% extends 'base.html' %}

{% block title %}Contact Us | ForecastFlow{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-lg p-8 glass rounded-3xl shadow-2xl border border-white/10 relative overflow-hidden">

        <!-- Decorative Glow -->
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-brand-500/20 rounded-full blur-3xl"></div>

        <div class="relative z-10">
            <h2 class="text-3xl font-bold text-center mb-2 text-white">Get in Touch</h2>
            <p class="text-center text-gray-400 mb-8">Have questions? We'd love to hear from you.</p>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div class="space-y-2">
                    <label for="name" class="text-sm font-medium text-gray-300 ml-1">Name</label>
                    <input type="text" name="name" id="name" required
                        class="w-full px-4 py-3 bg-dark-bg/50 border border-dark-border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all text-white placeholder-gray-500"
                        placeholder="Your Name">
                </div>

                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium text-gray-300 ml-1">Email</label>
                    <input type="email" name="email" id="email" required
                        class="w-full px-4 py-3 bg-dark-bg/50 border border-dark-border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all text-white placeholder-gray-500"
                        placeholder="you@example.com">
                </div>

                <div class="space-y-2">
                    <label for="message" class="text-sm font-medium text-gray-300 ml-1">Message</label>
                    <textarea name="message" id="message" rows="4" required
                        class="w-full px-4 py-3 bg-dark-bg/50 border border-dark-border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all text-white placeholder-gray-500 resize-none"
                        placeholder="How can we help you?"></textarea>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg shadow-brand-500/20 transition-all duration-300 transform hover:scale-[1.02]">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
